<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-battery" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff7f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a3d24" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58ffa6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00c853" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00ff7f"/>
      <stop offset="100%" stop-color="#58ffa6"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background decorative rings -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="#00ff7f" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.25"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="#58ffa6" stroke-width="1" stroke-dasharray="4 12" opacity="0.15"/>

  <!-- Battery Terminal Top -->
  <rect x="215" y="85" width="70" height="24" rx="8" fill="#58ffa6" opacity="0.9" filter="url(#neon-glow)"/>

  <!-- Battery Main Body -->
  <rect x="150" y="115" width="200" height="290" rx="28" fill="#040d08" stroke="#00ff7f" stroke-width="4" filter="url(#neon-glow)"/>

  <!-- Inner Power Level Cells -->
  <rect x="170" y="325" width="160" height="60" rx="12" fill="url(#grad-battery)" opacity="0.9"/>
  <rect x="170" y="255" width="160" height="58" rx="12" fill="url(#grad-battery)" opacity="0.8"/>
  <rect x="170" y="185" width="160" height="58" rx="12" fill="url(#grad-battery)" opacity="0.7"/>

  <!-- Glowing Energy Bolt in Center -->
  <path d="M265 145 L215 255 L255 255 L235 345 L295 235 L255 235 Z" fill="url(#bolt-grad)" filter="url(#neon-glow)"/>

  <!-- Tech Dots / Circuit Grid Accents -->
  <circle cx="120" cy="200" r="4" fill="#00ff7f" opacity="0.6"/>
  <circle cx="380" cy="300" r="5" fill="#58ffa6" opacity="0.5"/>
  <circle cx="360" cy="180" r="3" fill="#00ff7f" opacity="0.7"/>
  <circle cx="130" cy="320" r="4" fill="#58ffa6" opacity="0.4"/>
</svg>
